"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](vivid_mint)\
$os\
$username\
[](bg:vivid_mint fg:vivid_mint)\
$directory\
[](fg:vivid_mint bg:pale_cyan)\
$git_branch\
$git_status\
[](fg:pale_cyan bg:pale_seafoam)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:pale_seafoam bg:dark_gray_alt)\
$docker_context\
[](fg:dark_gray_alt bg:dark_gray)\
$time\
[ ](fg:dark_gray)\
$line_break$character"""

palette = 'justmango_neon'

[palettes.justmango_neon]
black_text    = '#000000' # High-contrast black text for bright pills
soft_lavender = '#d8b4ff' # Used for command/vim indicators now
pale_cyan     = '#dbfdf8' # mTertiary
pale_seafoam  = '#bffff3' # mSecondary
vivid_mint    = '#9effeb' # mPrimary
bright_green  = '#a8e6cf' # Terminal success green
bright_red    = '#ff6f9b' # mError
dark_gray     = '#161616' # Dark container background
dark_gray_alt = '#303030' # Medium container block

[os]
disabled = false
style = "bg:vivid_mint fg:black_text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:vivid_mint fg:black_text"
style_root = "bg:vivid_mint fg:black_text"
format = '[ $user ]($style)'

[directory]
style = "fg:black_text bg:vivid_mint"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:pale_cyan"
format = '[[ $symbol $branch ](fg:black_text bg:pale_cyan)]($style)'

[git_status]
style = "bg:pale_cyan"
format = '[[($all_status$ahead_behind )](fg:black_text bg:pale_cyan)]($style)'

[nodejs]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[c]
symbol = " "
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[rust]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[golang]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[php]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[java]
symbol = " "
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[kotlin]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[haskell]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[python]
symbol = ""
style = "bg:pale_seafoam"
format = '[[ $symbol( $version) ](fg:black_text bg:pale_seafoam)]($style)'

[docker_context]
symbol = ""
style = "bg:dark_gray_alt"
format = '[[ $symbol( $context) ](fg:vivid_mint bg:dark_gray_alt)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:dark_gray"
format = '[[  $time ](fg:pale_cyan bg:dark_gray)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:bright_green)'
error_symbol = '[](bold fg:bright_red)'
vimcmd_symbol = '[](bold fg:bright_green)'
vimcmd_replace_one_symbol = '[](bold fg:soft_lavender)'
vimcmd_replace_symbol = '[](bold fg:soft_lavender)'
vimcmd_visual_symbol = '[](bold fg:soft_lavender)'
