// Mouse Sensitivity (1600 Hz / DPI baseline)
sensitivity "1.1"
zoom_sensitivity_ratio "1.25"

// Key Bindings
bind "q" "slot1"                                 // Primary
bind "1" "slot2"                                 // Secondary
bind "e" "slot3"                                 // Melee
bind "2" "slot5"                                 // C4 / Bomb
bind "x" "slot8"                                 // Smoke
bind "c" "slot10"                                // Molotov / Incendiary
bind "mouse4" "slot6"                            // HE Grenade
bind "mouse5" "slot7"                            // Flashbang
bind "z" "+lookatweapon; r_cleardecals 1"        // Inspect
bind "f" "+use"                                  // Use / Defuse
bind "b" "buymenu"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"

// Helper
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
cl_use_opens_buy_menu "0"

// Viewmodel
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"

// Radar & HUD Preferences
cl_hud_radar_scale "1"
cl_radar_scale "0.35"
cl_radar_rotate "1"
cl_radar_always_centered "0"
cl_radar_square_with_scoreboard "1"

// Audio
volume "0.64"
snd_headphone_eq "0"
snd_spatialize_lerp "0.5"
snd_steamaudio_enable_perspective_correction "1"
snd_steamaudio_reverb_level_db "-3"
snd_autodetect_latency "1"
snd_mixahead "0.001"

// Music & Ambient Audio
snd_menumusic_volume "0.0"
snd_menumap_volume "0.0"
snd_roundstart_volume "0.0"
snd_roundend_volume "0.0"
snd_mapobjective_volume "0.0"
snd_deathcamera_volume "0.0"
snd_tensecondwarning_volume "0.12"
snd_mvp_volume "0.0"
snd_mute_mvp_music_live_players "1"
snd_mute_losefocus "1"

// Voice Chat
snd_voipvolume "0.72"
cl_mute_enemy_team "0"
cl_mute_all_but_friends_and_party "0"
cl_clutch_mode "0"
voice_modenable "1" 

// Performance & Telemetry
rate "1000000"
mm_dedicated_search_maxping "80"
cl_net_buffer_ticks "0"
cl_join_advertise "2"
cl_hud_telemetry_frametime_show "2"    // Show FPS/frame time
cl_hud_telemetry_ping_show "2"         // Show Ping
cl_hud_telemetry_net_misdelivery_show "2" // Show Packet Loss/Misdelivery
fps_max "400"
engine_low_latency_sleep_after_client_tick "1"
engine_no_focus_sleep "0"

// Force execute write
host_writeconfig
